apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remnanode.fullname" . }}
  labels:
    {{- include "remnanode.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "remnanode.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remnanode.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.geodata.enabled }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap-downloader.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.ioThrottling (and .Values.ioThrottling.enabled .Values.ioThrottling.cgroupIoMax) }}
        io.container.cgroup.io.max: {{ .Values.ioThrottling.cgroupIoMax | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: {{ if .Values.node.hostNetwork }}true{{ else }}false{{ end }}
      dnsPolicy: {{ if .Values.node.hostNetwork }}ClusterFirstWithHostNet{{ else }}ClusterFirst{{ end }}

      {{- if .Values.geodata.enabled }}
      initContainers:
        - name: init-downloader
          image: curlimages/curl:8.18.0
          command: ["/bin/sh", "/scripts/download.sh", "init"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: geodata
              mountPath: /data
      {{- end }}

      containers:
        - name: remnanode
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag }}"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: NODE_PORT
              value: {{ .Values.node.apiPort | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.node.existingSecret (printf "%s-secrets" (include "remnanode.fullname" .)) }}
                  key: SECRET_KEY
            {{- if .Values.geodata.enabled }}
            - name: XRAY_LOCATION_ASSET
              value: /data
            {{- end }}
          ports:
            - containerPort: {{ .Values.node.apiPort }}
              name: api
              protocol: TCP
              {{- if .Values.node.hostNetwork }}
              hostPort: {{ .Values.node.apiPort }}
              {{- end }}
            {{- range .Values.inbounds }}
            - containerPort: {{ .port }}
              name: {{ lower (default "tcp" .protocol) }}-{{ .port }}
              protocol: {{ default "TCP" .protocol | upper }}
              {{- if and $.Values.node.hostNetwork (eq .mode "direct") }}
              hostPort: {{ .port }}
              {{- end }}
            {{- end }}
          volumeMounts:
            {{- if and .Values.tmpfs .Values.tmpfs.enabled }}
            - name: ram-tmp
              mountPath: /tmp
            {{- if and .Values.tmpfs.cache .Values.tmpfs.cache.enabled }}
            - name: ram-cache
              mountPath: {{ .Values.tmpfs.cache.mountPath }}
            {{- end }}
            {{- end }}
            {{- if .Values.geodata.enabled }}
            - name: geodata
              mountPath: /data
            {{- end }}
            {{- if .Values.node.tlsMount.enabled }}
            - name: tls-cert
              mountPath: {{ .Values.node.tlsMount.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
        {{- if .Values.geodata.enabled }}
        - name: background-updater
          image: curlimages/curl:8.18.0
          command:
            - /bin/sh
            - -c
            - |
              echo "[SIDECAR] Started. Will update geodata every 12 hours in background."
              while true; do
                sleep 43200
                /bin/sh /scripts/download.sh update
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: geodata
              mountPath: /data
        {{- end }}

      volumes:
        {{- if and .Values.tmpfs .Values.tmpfs.enabled }}
        - name: ram-tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ default "64Mi" (and .Values.tmpfs.tmp .Values.tmpfs.tmp.sizeLimit) }}
        {{- if and .Values.tmpfs.cache .Values.tmpfs.cache.enabled }}
        - name: ram-cache
          emptyDir:
            medium: Memory
            sizeLimit: {{ default "128Mi" .Values.tmpfs.cache.sizeLimit }}
        {{- end }}
        {{- end }}
        {{- if .Values.geodata.enabled }}
        - name: geodata
          persistentVolumeClaim:
            claimName: {{ include "remnanode.fullname" . }}-geodata
        - name: scripts
          configMap:
            name: {{ include "remnanode.fullname" . }}-downloader-script
            defaultMode: 0755
        {{- end }}
        {{- if .Values.node.tlsMount.enabled }}
        - name: tls-cert
          secret:
            secretName: {{ .Values.node.tlsMount.secretName }}
            defaultMode: {{ .Values.node.tlsMount.defaultMode }}
        {{- end }}